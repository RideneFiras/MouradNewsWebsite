<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Markazi+Text:wght@600&family=IBM+Plex+Sans+Arabic:wght@400&display=block" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8;color:#17140F;font-family:'IBM Plex Sans Arabic';padding:32px}
h2{font-size:13px;font-weight:400;color:#6e6658;margin:28px 0 10px;border-top:1px solid #cdc5b4;padding-top:8px}
.row{display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap}
.np{text-align:center}
.np .name{font-family:'Aref Ruqaa';font-size:84px;line-height:1.35;margin-top:-6px}
.np .latin{font-family:'Markazi Text';letter-spacing:.3em;font-size:13px;margin-top:18px}
.lock{display:flex;align-items:center;gap:14px}
.lock .name{font-family:'Aref Ruqaa';font-size:64px;line-height:1}
.rule{border-top:3px solid #17140F;border-bottom:1px solid #17140F;height:2px;margin-top:10px}
.dark{background:#17140F;padding:12px}
</style></head><body>
<h2>العلامة وحدها</h2>
<img src="borj-mark.svg" width="480">
<h2>ترويسة: العلامة فوق الاسم</h2>
<div class="np" style="width:520px"><img src="borj-mark.svg" width="150"><div class="name">البرج</div><div class="latin">EL BORJ</div><div class="rule"></div></div>
<h2>ترويسة أفقية</h2>
<div class="lock"><img src="borj-mark.svg" width="130"><div class="name">البرج</div></div>
<h2>أحجام صغيرة: العلامة بارتفاع 40px، ثم الأيقونة المربعة 64 و32 و16px</h2>
<div class="row"><img src="borj-mark.svg" height="40"><img src="borj-icon.svg" height="64"><img src="borj-icon.svg" height="32"><img src="borj-icon.svg" height="16"></div>
</body></html>
