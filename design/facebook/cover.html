<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Markazi+Text:wght@600&family=IBM+Plex+Sans+Arabic:wght@500&display=block" rel="stylesheet">
<style>
/* Facebook's page layout puts the profile picture over the middle of the cover's lower half:
   the fort sits on one side, the name on the other, the centre bottom stays empty. */
html,body{margin:0;width:1640px;height:624px;background:#F5F1E8;color:#17140F;overflow:hidden;position:relative}
.top{position:absolute;top:64px;left:120px;right:120px;border-top:2px solid #17140F}
.bottom{position:absolute;bottom:64px;left:120px;right:120px;border-top:9px solid #17140F;border-bottom:3px solid #17140F;height:6px}
.kick{position:absolute;top:84px;left:0;right:0;text-align:center;font-family:'IBM Plex Sans Arabic';font-size:26px;color:#4B453B}
.fort{position:absolute;left:280px;top:196px;width:365px}
.words{position:absolute;right:280px;top:150px;width:400px;text-align:center}
.name{font-family:'Aref Ruqaa';font-size:170px;line-height:1}
.latin{font-family:'Markazi Text';letter-spacing:.42em;font-size:28px;margin-top:58px}
.tag{font-family:'IBM Plex Sans Arabic';font-size:28px;color:#4B453B;margin-top:10px}
.guide{position:absolute;top:0;bottom:0;left:265px;right:265px;outline:3px dashed rgba(163,22,28,.7)}
</style></head><body>
<div class="top"></div>
<div class="kick">أخبار · ثقافة · رياضة</div>
<img class="fort" src="borj-mark.svg">
<div class="words"><div class="name">البرج</div><div class="latin">EL BORJ</div><div class="tag">جريدة إلكترونية مستقلّة</div></div>
<div class="bottom"></div>
<div class="guide" id="g"></div>
</body></html>
