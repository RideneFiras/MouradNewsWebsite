<!doctype html><html><head><meta charset="utf-8"><style>
/* Approximation of Facebook's desktop page header (measured on Firas's screenshot):
   cover 2.7:1, profile circle 18.5% of the width, centred, top at 54% of the cover height. */
body{margin:0;background:#242526;width:1000px;height:520px;position:relative}
.cover{position:absolute;left:30px;top:20px;width:940px;height:348px;background:url(cover.png) center/cover;border-radius:8px}
.pp{position:absolute;left:calc(30px + 470px - 87px);top:calc(20px + 188px);width:174px;height:174px;border-radius:50%;background:url(profile.png) center/cover;outline:4px solid #242526}
</style></head><body><div class="cover"></div><div class="pp"></div></body></html>
