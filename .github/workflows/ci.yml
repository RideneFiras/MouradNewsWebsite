# Checks on every push and pull request (free GitHub Actions minutes). Deployment stays
# manual (docs/DEPLOY.md) until the owner adds Cloudflare secrets; see the commented job.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations bundle is up to date
        run: pnpm db:bundle && git diff --exit-code supabase/ALL_MIGRATIONS.sql
      - name: Production build (placeholder public env, no secrets needed)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          SITE_URL: https://example.tn

